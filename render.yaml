# Render Blueprint for the backend API only.
# The frontend is deployed separately as a static site.
# Video export runs in the user's browser — this service does not start Chromium.
services:
  - type: web
    name: bestmotions-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: SERVE_FRONTEND
        value: "false"
      - key: FEATURE_VIDEO_SOUND
        value: "false"
      # Render injects PORT automatically.
