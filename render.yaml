# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bestmotions
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      # PORT is provided by Render automatically
