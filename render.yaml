# Render Blueprint for the backend API only.
# The frontend is deployed separately as a static site.
services:
  - type: web
    name: bestmotions-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: SERVE_FRONTEND
        value: "false"
      - key: FEATURE_VIDEO_SOUND
        value: "false"
      # Render injects PORT automatically.
